<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mind Your Manners</title><style>:root{font-family:system-ui;color:#142b51}*{box-sizing:border-box}body{margin:0;background:#fff0d9}header{background:#14345b;color:white;padding:16px;text-align:center}h1{margin:0;font-size:clamp(30px,6vw,55px)}h1 span{color:#ff806e}.wrap{max-width:900px;margin:auto;padding:20px}.panel{background:white;border:3px solid #163c68;border-radius:24px;box-shadow:0 8px 0 #d7b998;padding:22px;margin:18px 0}.scene{background:linear-gradient(135deg,#ffe1a6,#f5b97b);border-radius:20px;padding:20px;min-height:170px;display:grid;place-items:center;text-align:center}.avatar{font-size:65px}button{font:inherit;cursor:pointer;border:2px solid #12385c;background:#fff;border-radius:15px;padding:13px;margin:5px;text-align:left}button:hover,button:focus{background:#dcf7ef}button.primary{background:#ff7969;color:#142b51;font-weight:800}button:disabled{opacity:.5;cursor:default}.choices{display:grid;gap:8px}.choices button{width:100%;margin:0}.meter{height:16px;border-radius:20px;background:#e5e7eb;overflow:hidden}.meter>div{height:100%;background:#36c5a4;transition:width .3s}.pill{background:#e8f3ff;border-radius:50px;padding:7px 12px;display:inline-block;margin:4px}.muted{color:#53667c}nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}nav button{background:#fdf2d4}.feedback{padding:15px;border-radius:16px;background:#e7f8f3;margin-top:12px}footer{text-align:center;padding:30px;color:#53667c}.scene{position:relative;overflow:hidden;min-height:300px;background:linear-gradient(#b7e5f4 0 44%,#f8dfae 44% 47%,#c98761 47% 53%,#e9ad7c 53%);border:4px solid #163c68;box-shadow:inset 0 -12px #b56b51}.scene:before{content:"";position:absolute;inset:10px 12px auto;height:110px;background:repeating-linear-gradient(90deg,#fff9e8 0 22%,#c5edf4 22% 27%);border:8px solid #8d593c;border-radius:70px 70px 12px 12px;opacity:.75}.scene:after{content:"☕   🥐   🧁";position:absolute;bottom:5px;left:0;right:0;background:#9a5b3b;border-top:8px solid #f5d4a4;padding:8px;font-size:25px}.scene>div{position:relative;z-index:1;background:#fff9ebee;border:3px solid #163c68;border-radius:20px;padding:12px 24px;max-width:95%;box-shadow:0 6px 0 #15385d33}.avatar{display:inline-grid;place-items:center;width:112px;height:112px;background:#ffd28b;border:4px solid #163c68;border-radius:50%;font-size:64px;box-shadow:0 6px #163c6830;animation:pop .3s ease-out}@keyframes pop{from{transform:scale(.88);opacity:.5}to{transform:scale(1);opacity:1}}.choices button{font-weight:650;background:#f9f9ff;box-shadow:0 4px #163c6820;transition:transform .15s}.choices button:hover{transform:translateY(-2px);background:#e3f9f4}.panel{background:#fffdf6}header{background:linear-gradient(125deg,#173c65,#245c7a);border-bottom:8px solid #ffcb75}.pill{font-weight:750}.feedback{border:2px solid #35b39e}.chapter-map{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}.chapter-map span{border:2px solid #173c65;border-radius:14px;padding:12px;background:#e9f5ff;font-weight:700}.chapter-map span.locked{filter:grayscale(1);opacity:.55}@media(max-width:520px){.wrap{padding:10px}.panel{padding:14px}.scene{min-height:270px}.scene>div{padding:8px 12px}.avatar{height:85px;width:85px;font-size:48px}}.hero{display:grid;grid-template-columns:minmax(130px,230px) 1fr;align-items:center;gap:22px;background:linear-gradient(135deg,#ffe3a9,#ffc4a9);border:3px solid #163c68;border-radius:22px;padding:18px}.hero-portrait{background:#fff3d8;border-radius:24px;border:3px solid #163c68;overflow:hidden;text-align:center}.hero-portrait svg{width:100%;max-height:260px}.hero h2{font-size:clamp(24px,4vw,40px);line-height:1.15}.stats,.mood-title{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.mood-title{margin:12px 0 6px}.cafe-art{height:310px;position:relative;overflow:hidden;border:4px solid #163c68;border-radius:20px;background:linear-gradient(#9cdaef 0 55%,#f8d5a5 55% 58%,#c7845f 58%);margin-top:18px}.cafe-window{position:absolute;top:12px;left:16px;width:34%;height:150px;border:10px solid #fff3d5;border-radius:80px 80px 10px 10px;background:linear-gradient(#8ed2ef,#c5f0e9);display:flex;justify-content:space-around;padding-top:22px;font-size:25px;box-shadow:0 0 0 3px #163c68}.cafe-sign{position:absolute;right:12px;top:15px;background:#fff4d9;border:3px solid #163c68;border-radius:12px;padding:10px;font-weight:900;font-size:clamp(12px,2.5vw,20px);transform:rotate(3deg)}.shelf{position:absolute;bottom:100px;right:10px;background:#ffe1b1;border:3px solid #163c68;border-radius:10px;padding:8px;font-size:30px}.character{position:absolute;bottom:20px;left:32%;height:245px;z-index:2;animation:pop .25s ease-out}.lily{height:100%;width:auto;filter:drop-shadow(2px 4px 0 #163c6830)}.counter{position:absolute;bottom:0;left:0;right:0;height:54px;background:#b56d4c;border-top:12px solid #f9d5a3;z-index:3}.speech{margin:-12px 15px 20px;position:relative;z-index:4;background:#fffdf5;border:3px solid #163c68;border-radius:19px;padding:14px 18px;box-shadow:0 5px #163c6830}.speech strong{color:#d05254}.speech p{font-size:clamp(17px,3vw,22px);font-weight:750;margin:10px 0}.speech button{padding:7px 11px;font-size:14px}.choice-letter{display:inline-grid;place-items:center;background:#ffcc7d;border:2px solid #163c68;border-radius:50%;height:30px;width:30px;margin-right:12px;font-weight:900}.phrase{display:flex;align-items:center;gap:12px;border-bottom:1px solid #ddd;padding:9px 0;flex-wrap:wrap}.phrase span{color:#53667c}.badge-display{text-align:center;background:#fff0d0;border:3px solid #163c68;border-radius:20px;padding:30px}.badge-display>span{font-size:75px}@media(max-width:520px){.hero{grid-template-columns:1fr;text-align:center}.hero-portrait{max-width:190px;margin:auto}.cafe-art{height:260px}.character{height:205px;left:25%}.cafe-window{height:115px}.shelf{font-size:20px;bottom:80px}.speech{margin:-12px 6px 14px}} .context-note{background:#eaf5ff;border:2px dashed #4b83ad;border-radius:16px;padding:12px 16px;margin:10px 0}.context-note p{margin:5px 0;color:#34506b}.context-note strong{color:#163c68}</style><header><h1>👑 Mind Your <span>Manners</span></h1><p>Small words, big difference! 🇬🇧</p><nav><button onclick="show('home')">🏠 Home</button><button onclick="show('game')">☕ The Café</button><button onclick="show('phrases')">📖 Phrasebook</button><button onclick="show('badges')">🏆 Badges</button></nav></header><main class="wrap"><div id="app"></div></main><footer>Modern Cartoon · London Café · Brot2You</footer><script>
const app=document.getElementById('app');const saved=JSON.parse(localStorage.getItem('mym-v1')||'{}');let best=saved.best||0,ending=saved.ending||'',node='welcome',mood=60,xp=0,answers=0,history=[],selected=false,displayChoices=[];
const story={
welcome:{line:"Hello there! Welcome to the Corner Café. What can I get you?",choices:[["Could I have a hot chocolate, please?",12,20,"Polite request: could I… softens the request.", "offer"],["Give me a hot chocolate.",-18,0,"An imperative can sound demanding to someone you do not know.","repair"],["Where's the train station?",-8,0,"The question is understandable, but it doesn't answer Lily.","clarify"]]},
repair:{line:"Oh! Of course. Would you mind asking a little more politely?",choices:[["Sorry! Could I have a hot chocolate, please?",16,20,"An apology and a reformulated request repair the exchange.","offer"],["I said, give me one.",-20,0,"Repeating a demand makes the situation more tense.","manager"],["I don't understand. Could you explain?",8,12,"Asking for clarification is a useful repair strategy.","offer"]]},
clarify:{line:"The station? I can help with that later. Would you like to order first?",choices:[["Oh, sorry. Could I have a hot chocolate?",12,20,"You acknowledge the misunderstanding and return to the topic.","offer"],["No, just tell me where it is.",-12,0,"This is direct and may sound dismissive.","station"],["Yes, please. And could you help me afterwards?",16,20,"You respond to the offer and make a second request politely.","offer"]]},
manager:{line:"I'm happy to help, but please speak to me respectfully.",choices:[["You're right. I'm sorry. Could I start again?",18,15,"A sincere apology helps rebuild rapport.","offer"],["Whatever.",-15,0,"Dismissive language damages the interaction.","early"],["What did I do wrong?",5,8,"A genuine question opens a chance to learn.","repair"]]},
station:{line:"It's two streets away. Shall I write the directions down?",choices:[["Yes, please. That's very kind of you.",15,18,"You accept the offer politely.","early"],["Just tell me quickly.",-12,0,"This sounds impatient.","early"],["No thanks, I can remember.",6,8,"A brief refusal can still be appropriate.","early"]]},
offer:{line:"Certainly! Would you like whipped cream on top?",choices:[["Yes, please. That would be lovely!",12,18,"A warm way to accept an offer.","out"],["No, thank you.",12,18,"A concise, polite refusal is perfectly appropriate.","payment"],["Yeah, whatever.",-15,0,"This sounds dismissive, not friendly.","out"]]},
out:{line:"I'm afraid we've run out of whipped cream today.",choices:[["No worries! Thanks for letting me know.",16,20,"You respond tactfully to disappointing news.","payment"],["But I wanted it! That's unfair.",-18,0,"This sounds disproportionate to a small problem.","apology"],["Oh, could I have marshmallows instead?",12,18,"You propose a reasonable alternative politely.","payment"]]},
apology:{line:"I'm sorry about that. We do have marshmallows.",choices:[["That would be great, thank you.",15,18,"You accept a helpful alternative.","payment"],["Fine, I suppose.",-8,0,"This can sound reluctant or dismissive.","payment"],["Sorry, I overreacted. Marshmallows, please.",18,20,"Acknowledging your reaction repairs the conversation.","payment"]]},
payment:{line:"That's £3.50, please. How would you like to pay?",choices:[["By card, please. Here you are.",12,18,"A clear and courteous response.","bye"],["Card.",1,5,"Short answers can work, but tone and context matter.","bye"],["Why is it so expensive?",-8,0,"You may ask about prices, but a calmer formulation would help.","price"]]},
price:{line:"That's our menu price. Would you like something less expensive?",choices:[["Yes, please. What would you recommend?",14,18,"A respectful way to ask for alternatives.","bye"],["No, I'll pay. Thank you.",10,15,"You resolve the disagreement courteously.","bye"],["Your café is ridiculous.",-20,0,"Insults are unhelpful in a disagreement.","bye"]]},
bye:{line:"Here's your drink. Enjoy the rest of your day!",choices:[["Thanks! Have a lovely day too!",14,20,"A friendly closing appropriate for a café.","friend"],["Cheers!",12,18,"A common, natural informal British thank-you in this setting.","friend"],["Finally!",-16,0,"This sounds impatient and ungrateful.","friend"]]},
friend:{line:"Hey! I'm Maya, your classmate. Fancy hanging out after school?",speaker:"Maya · Classmate",context:"You know Maya from school. She is speaking casually as a friend.",choices:[["I would be most delighted to accept your kind invitation.",2,7,"Grammatically polite, but unusually formal for a chat between classmates.","end"],["Yeah, sounds great! See you later!",14,20,"Friendly, natural informal English between classmates.","end"],["Thanks for asking! I can't today, but maybe tomorrow?",14,20,"A considerate refusal with an alternative is just as appropriate.","end"]]},
early:{line:"All right. I hope the rest of your day goes well.",choices:[["Thank you for your help!",12,16,"A polite closing can improve the interaction.","end"],["Bye.",4,8,"A neutral, brief farewell.","end"],["Whatever.",-12,0,"This dismissive response ends things awkwardly.","end"]]}
};
function persist(){localStorage.setItem('mym-v1',JSON.stringify({best,ending}))}
function portrait(emotion='neutral'){const eyes=emotion==='happy'?'<path d="M74 98q8-10 16 0m35 0q8-10 16 0" fill="none" stroke="#26395d" stroke-width="5" stroke-linecap="round"/>':emotion==='upset'?'<path d="M74 99l14-4m38 0 14 4" stroke="#26395d" stroke-width="5" stroke-linecap="round"/>':'<ellipse cx="82" cy="99" rx="4" ry="6" fill="#26395d"/><ellipse cx="133" cy="99" rx="4" ry="6" fill="#26395d"/>';const mouth=emotion==='happy'?'M96 126q12 16 25 0':emotion==='upset'?'M98 133q12-10 24 0':'M99 126q11 8 22 0';return '<svg class="lily" viewBox="0 0 220 260" role="img" aria-label="Lily, the café barista"><ellipse cx="110" cy="249" rx="83" ry="9" fill="#163c6830"/><path d="M31 257q4-93 79-93t79 93" fill="#f16d66" stroke="#163c68" stroke-width="5"/><path d="M82 172v31l28 17 29-17v-31" fill="#d9906d" stroke="#163c68" stroke-width="4"/><path d="M54 99q-14-76 57-78 70 1 56 78v58H54z" fill="#513b48" stroke="#163c68" stroke-width="5"/><ellipse cx="110" cy="111" rx="58" ry="68" fill="#d99572" stroke="#163c68" stroke-width="5"/><path d="M53 91q-9-60 54-66 67-2 61 69-23-5-34-32-31 31-81 29" fill="#513b48" stroke="#163c68" stroke-width="4"/>'+eyes+'<path d="'+mouth+'" stroke="#913e4d" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="65" cy="119" r="10" fill="#f29c8e" opacity=".65"/><circle cx="152" cy="119" r="10" fill="#f29c8e" opacity=".65"/><path d="M75 204l35 22 35-22 12 53H63z" fill="#f7e7c9" stroke="#163c68" stroke-width="4"/><path d="M68 53q43-35 85 0" fill="none" stroke="#ffe2a5" stroke-width="10" stroke-linecap="round"/></svg>'}
function sceneMarkup(line,emotion,speaker){return '<div class="cafe-art"><div class="cafe-window"><span>☁️</span><span>🇬🇧</span></div><div class="cafe-sign">THE CORNER CAFÉ</div><div class="shelf">🥐 &nbsp; 🧁 &nbsp; 🥯</div><div class="character">'+portrait(emotion)+'</div><div class="counter"></div></div><div class="speech"><strong>Lily · Barista</strong><p>“'+line+'”</p><button onclick="speak(story[node].line)">🔊 Listen</button></div>'}
function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.88;speechSynthesis.speak(u)}}
function show(page){if(page==='home'){app.innerHTML='<section class="panel"><div class="hero"><div class="hero-portrait">'+portrait('happy')+'</div><div><span class="pill">🇬🇧 London adventures</span><h2>Every word makes a difference!</h2><p>Meet Lily, choose your words and discover how conversations can change.</p><button class="primary" onclick="start()">▶ Play The London Café</button></div></div><div class="chapter-map"><span>☕ 01 · The London Café</span><span class="locked">🏫 02 · First Day at School 🔒</span><span class="locked">🚇 03 · Lost in London 🔒</span></div><p class="pill">⭐ Best score: '+best+' XP</p><p class="pill">🎭 Multiple endings</p></section>'}else if(page==='game'){render()}else if(page==='phrases'){let p=[["Could I have …, please?","Making a polite request"],["I'm afraid …","Sharing disappointing news tactfully"],["No worries.","Reassuring someone"],["Would you mind …?","Asking for a change politely"],["Could you explain?","Asking for clarification"],["Here you are.","Handing something over"],["What would you recommend?","Asking for advice"],["Cheers!","Informal British thanks"],["Have a lovely day!","Friendly farewell"]];app.innerHTML='<section class="panel"><h2>📖 My Phrasebook</h2><p>Listen to useful expressions and notice when they fit.</p>'+p.map(v=>'<div class="phrase"><button data-s="'+v[0].replaceAll('"','&quot;')+'" onclick="speak(this.dataset.s)">🔊 '+v[0]+'</button><span>'+v[1]+'</span></div>').join('')+'</section>'}else{app.innerHTML='<section class="panel"><h2>🏆 Your badges</h2><div class="badge-display"><span>🏅</span><h3>'+(ending?'Café Explorer unlocked!':'Café Explorer · Locked')+'</h3><p>Finish the café story to earn your first badge.</p><p>⭐ Best score: '+best+' XP</p></div></section>'}}
function start(){node='welcome';mood=60;xp=0;answers=0;history=[];selected=false;render()}
function render(){if(node==='end'){finish();return}const s=story[node];displayChoices=s.choices.map((o,i)=>({o,i}));for(let i=displayChoices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[displayChoices[i],displayChoices[j]]=[displayChoices[j],displayChoices[i]]}const emotion=node==='friend'?'happy':mood>=75?'happy':mood<40?'upset':'neutral';app.innerHTML='<section class="panel game"><div class="stats"><span class="pill">☕ The London Café</span><span class="pill">⭐ '+xp+' XP</span></div><div class="mood-title"><strong>Lily’s mood</strong><span>'+mood+'/100</span></div><div class="meter" aria-label="Mood '+mood+' out of 100"><div style="width:'+mood+'%"></div></div>'+sceneMarkup(s.line,emotion)+'<h3>What would you say?</h3><div class="choices">'+displayChoices.map((entry,i)=>'<button onclick="choose('+i+')"><span class="choice-letter">'+String.fromCharCode(65+i)+'</span>'+entry.o[0]+'</button>').join('')+'</div><div id="response" aria-live="polite"></div></section>'}
function choose(i){if(selected)return;selected=true;const entry=displayChoices[i],o=entry.o;history.push({node,choice:entry.i});mood=Math.max(0,Math.min(100,mood+o[1]));xp+=o[2];answers++;document.querySelectorAll('.choices button').forEach(b=>b.disabled=true);document.getElementById('response').innerHTML='<div class="feedback"><strong>'+(o[1]>=10?'✨ Great social choice!':o[1]>=0?'💬 Context matters':'💡 Try a different approach')+'</strong><p>'+o[3]+'</p><p><strong>Lily’s reaction:</strong> '+(o[1]>0?'She appreciates your response.':o[1]<0?'She looks a little uncomfortable.':'She listens carefully.')+'</p><button class="primary" onclick="advance(\''+o[4]+'\')">Continue →</button></div>'}
function advance(next){selected=false;node=next;render()}
function finish(){best=Math.max(best,xp);ending=mood>=75?'Warm welcome':mood>=45?'A little awkward':'Time to reconnect';persist();app.innerHTML='<section class="panel"><div class="hero"><div class="hero-portrait">'+portrait(mood>=75?'happy':mood<40?'upset':'neutral')+'</div><div><h2>☕ '+ending+'</h2><p>You completed the café adventure!</p><p class="pill">⭐ '+xp+' XP</p><p class="pill">❤️ Mood '+mood+'/100</p><p>You explored '+answers+' decisions. Some situations have more than one suitable answer.</p></div></div><div class="feedback"><strong>What did you learn?</strong><p>Good communication depends on the situation, the person you are speaking to, and how your words may sound.</p><p>Try a different route to see new reactions and dialogue.</p></div><button class="primary" onclick="start()">↻ Explore another path</button><button onclick="show(\'phrases\')">📖 Phrasebook</button></section>'}
show('home');
</script></html>
