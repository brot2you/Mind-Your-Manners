<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mind Your Manners</title><style>:root{font-family:system-ui;color:#142b51}*{box-sizing:border-box}body{margin:0;background:#fff0d9}header{background:#14345b;color:white;padding:16px;text-align:center}h1{margin:0;font-size:clamp(30px,6vw,55px)}h1 span{color:#ff806e}.wrap{max-width:900px;margin:auto;padding:20px}.panel{background:white;border:3px solid #163c68;border-radius:24px;box-shadow:0 8px 0 #d7b998;padding:22px;margin:18px 0}.scene{background:linear-gradient(135deg,#ffe1a6,#f5b97b);border-radius:20px;padding:20px;min-height:170px;display:grid;place-items:center;text-align:center}.avatar{font-size:65px}button{font:inherit;cursor:pointer;border:2px solid #12385c;background:#fff;border-radius:15px;padding:13px;margin:5px;text-align:left}button:hover,button:focus{background:#dcf7ef}button.primary{background:#ff7969;color:#142b51;font-weight:800}button:disabled{opacity:.5;cursor:default}.choices{display:grid;gap:8px}.choices button{width:100%;margin:0}.meter{height:16px;border-radius:20px;background:#e5e7eb;overflow:hidden}.meter>div{height:100%;background:#36c5a4;transition:width .3s}.pill{background:#e8f3ff;border-radius:50px;padding:7px 12px;display:inline-block;margin:4px}.muted{color:#53667c}nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}nav button{background:#fdf2d4}.feedback{padding:15px;border-radius:16px;background:#e7f8f3;margin-top:12px}footer{text-align:center;padding:30px;color:#53667c}.scene{position:relative;overflow:hidden;min-height:300px;background:linear-gradient(#b7e5f4 0 44%,#f8dfae 44% 47%,#c98761 47% 53%,#e9ad7c 53%);border:4px solid #163c68;box-shadow:inset 0 -12px #b56b51}.scene:before{content:"";position:absolute;inset:10px 12px auto;height:110px;background:repeating-linear-gradient(90deg,#fff9e8 0 22%,#c5edf4 22% 27%);border:8px solid #8d593c;border-radius:70px 70px 12px 12px;opacity:.75}.scene:after{content:"☕   🥐   🧁";position:absolute;bottom:5px;left:0;right:0;background:#9a5b3b;border-top:8px solid #f5d4a4;padding:8px;font-size:25px}.scene>div{position:relative;z-index:1;background:#fff9ebee;border:3px solid #163c68;border-radius:20px;padding:12px 24px;max-width:95%;box-shadow:0 6px 0 #15385d33}.avatar{display:inline-grid;place-items:center;width:112px;height:112px;background:#ffd28b;border:4px solid #163c68;border-radius:50%;font-size:64px;box-shadow:0 6px #163c6830;animation:pop .3s ease-out}@keyframes pop{from{transform:scale(.88);opacity:.5}to{transform:scale(1);opacity:1}}.choices button{font-weight:650;background:#f9f9ff;box-shadow:0 4px #163c6820;transition:transform .15s}.choices button:hover{transform:translateY(-2px);background:#e3f9f4}.panel{background:#fffdf6}header{background:linear-gradient(125deg,#173c65,#245c7a);border-bottom:8px solid #ffcb75}.pill{font-weight:750}.feedback{border:2px solid #35b39e}.chapter-map{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}.chapter-map span{border:2px solid #173c65;border-radius:14px;padding:12px;background:#e9f5ff;font-weight:700}.chapter-map span.locked{filter:grayscale(1);opacity:.55}@media(max-width:520px){.wrap{padding:10px}.panel{padding:14px}.scene{min-height:270px}.scene>div{padding:8px 12px}.avatar{height:85px;width:85px;font-size:48px}}</style><header><h1>👑 Mind Your <span>Manners</span></h1><p>Small words, big difference! 🇬🇧</p><nav><button onclick="show('home')">🏠 Home</button><button onclick="show('game')">☕ The Café</button><button onclick="show('phrases')">📖 Phrasebook</button><button onclick="show('badges')">🏆 Badges</button></nav></header><main class="wrap"><div id="app"></div></main><footer>Modern Cartoon · London Café · Brot2You</footer><script>const scenes=[{name:"Lily",face:"👩🏽‍🍳",line:"Good morning! What can I get you?",options:[["Could I have a hot chocolate, please?",12,"A polite request with could I… and please."],["Give me a hot chocolate.",-12,"Understandable, but rather abrupt with a stranger."],["Where is the train station?",-8,"That doesn't answer Lily's question."]]}, {name:"Lily",face:"👩🏽‍🍳",line:"Of course! Would you like it with whipped cream?",options:[["Yes, please. That would be lovely!",12,"Friendly and appropriate."],["Yeah, whatever.",-12,"This sounds dismissive."],["I'm thirteen years old.",-8,"Try to respond to the offer."]]},{name:"Lily",face:"👩🏽‍🍳",line:"I'm afraid we've run out of whipped cream.",options:[["No worries, thank you for letting me know.",14,"You respond kindly to disappointing news."],["That's terrible! Fix it!",-15,"This is too aggressive for a small inconvenience."],["I like football.",-8,"Stay relevant to the conversation."]]},{name:"Lily",face:"👩🏽‍🍳",line:"That'll be £3.50, please.",options:[["Here you are. Thank you!",12,"A natural way to pay and thank someone."],["Take it.",-12,"A little abrupt."],["Can you speak French?",-5,"A possible question, but not a response to payment."]]},{name:"Lily",face:"👩🏽‍🍳",line:"Here's your drink. Enjoy your day!",options:[["Thanks! Have a lovely day too!",14,"You close the conversation warmly."],["Finally!",-15,"This sounds impatient and ungrateful."],["I need a pencil.",-7,"This is unrelated to the farewell."]]}];let step=0,mood=65,xp=0,answered=false;let reactions=[];let saved=JSON.parse(localStorage.getItem('mym-v1')||'{}');let best=saved.best||0;const app=document.getElementById('app');function save(){localStorage.setItem('mym-v1',JSON.stringify({best}))}function show(page){if(page==='home'){app.innerHTML='<section class="panel"><div class="scene"><div><div class="avatar">🇬🇧☕🎒</div><h2>Welcome to London!</h2><p>Meet Lily at the Corner Café. Your words shape the story.</p></div></div><h2>Chapter 1 · The London Café</h2><p>Choose what to say. Notice how your choices affect the conversation. Can you build a friendly connection?</p><p class="pill">A1–A2</p><p class="pill">5 situations</p><div class="chapter-map"><span>☕ 1 · Café</span><span class="locked">🏫 2 · School 🔒</span><span class="locked">🚇 3 · London 🔒</span></div><p class="pill">Best score: '+best+' XP</p><p><button class="primary" onclick="start()">▶ Start adventure</button></p></section>'}else if(page==='game'){render()}else if(page==='phrases'){let a=[["Could I have …, please?","Polite request"],["Would you like …?","Offer"],["Yes, please.","Accept politely"],["No, thank you.","Refuse politely"],["I'm afraid …","Introduce disappointing news"],["No worries.","Reassure someone"],["Here you are.","Hand something over"],["Have a lovely day!","Friendly farewell"],["Excuse me.","Get attention"],["Could you repeat that, please?","Ask for clarification"]];app.innerHTML='<section class="panel"><h2>📖 My Phrasebook</h2><p>Tap a phrase to hear it.</p>'+a.map(v=>'<p><button onclick="speak(this.dataset.s)" data-s="'+v[0]+'">🔊 '+v[0]+'</button> <span class="muted">'+v[1]+'</span></p>').join('')+'</section>'}else{app.innerHTML='<section class="panel"><h2>🏆 Your Badges</h2><p>Complete the café adventure to unlock a badge.</p><div class="scene"><div class="avatar">'+(best>0?'🏅':'🔒')+'</div><h2>'+(best>0?'Café Explorer unlocked!':'Café Explorer locked')+'</h2><p>Best score: '+best+' XP</p></div></section>'}}function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}}function start(){step=0;mood=65;xp=0;answered=false;reactions=[];render()}function render(){if(step>=scenes.length){best=Math.max(best,xp);save();app.innerHTML='<section class="panel"><div class="scene"><div class="avatar">🌟☕</div><h2>Adventure complete!</h2><p>Lily says: “Thanks for stopping by!”</p></div><h2>Your result: '+xp+' XP</h2><p>Final mood: '+mood+'/100</p><p>'+ (mood>=75?'You made a warm impression!':mood>=45?'Some phrases worked well. Try again and explore other responses.':'Some words sounded abrupt. Try using more considerate expressions.')+'</p><button class="primary" onclick="start()">↻ Play again</button><button onclick="show(\'phrases\')">📖 Review phrases</button></section>';return}let s=scenes[step];s={...s,face:mood>=75?'😊':mood<40?'😟':s.face};app.innerHTML='<section class="panel"><p class="pill">☕ The London Café · '+(step+1)+' / '+scenes.length+'</p><p class="pill">⭐ '+xp+' XP</p><h3>Lily’s mood: '+mood+'/100</h3><div class="meter"><div style="width:'+mood+'%"></div></div><div class="scene"><div><div class="avatar">'+s.face+'</div><h2>'+s.name+'</h2><h3>“'+s.line+'”</h3><button onclick="speak('+JSON.stringify(s.line)+')">🔊 Listen</button></div></div><h3>What would you say?</h3><div class="choices">'+s.options.map((o,i)=>'<button id="c'+i+'" onclick="choose('+i+')">'+String.fromCharCode(65+i)+'. '+o[0]+'</button>').join('')+'</div><div id="response"></div></section>'}function choose(i){if(answered)return;answered=true;let o=scenes[step].options[i];reactions.push(i);mood=Math.max(0,Math.min(100,mood+o[1]));xp+=Math.max(0,o[1])*2;document.querySelectorAll('.choices button').forEach(b=>b.disabled=true);document.getElementById('response').innerHTML='<div class="feedback"><strong>'+(o[1]>0?'✨ Good choice!':'💬 Think about the context')+'</strong><p>'+o[2]+'</p><p>Mood '+(o[1]>0?'+':'')+o[1]+'</p><button class="primary" onclick="next()">Continue →</button></div>'}function next(){step++;answered=false;render()}show('home');</script></html>
